{% extends 'base.html' %}

{% block title %}Login - Insurance App{% endblock %}

{% block body_class %}login-page bg-light{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5 pt-4">
        <div class="col-md-5 col-lg-4">
            


            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 p-sm-5">
                    <h2 class="card-title text-center fw-bold text-primary mb-4">Login</h2>
                    
                    <form action="/login" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary">Username</label>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-control form-control-lg fs-6" 
                                placeholder="Masukkan username Anda" 
                                autocomplete="username"
                                required
                            >
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-control form-control-lg fs-6" 
                                placeholder="••••••••" 
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fs-6 fw-bold py-2 shadow-sm">
                                Masuk
                            </button>
                        </div>

                    </form>
                    
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
