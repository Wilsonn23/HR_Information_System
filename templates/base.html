<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Insurance App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block navbar %}
    <header>
        <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand mb-0" href="/dashboard">Insurance Dashboard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        {% if session.get('role') == 'admin' %}
                            <li class="nav-item"><a class="nav-link {% if active_page=='master' %}active{% endif %}" href="/master">Master</a></li>
                            <li class="nav-item"><a class="nav-link {% if active_page=='logs' %}active{% endif %}" href="/logs">Logs</a></li>
                            <li class="nav-item"><a class="nav-link {% if active_page=='users' %}active{% endif %}" href="/users">Users</a></li>
                        {% endif %}
                        <li class="nav-item"><a class="nav-link {% if active_page=='dashboard' %}active{% endif %}" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link {% if active_page=='transaksi' %}active{% endif %}" href="/transaksi">Transaksi</a></li>
                        <li class="nav-item"><a class="nav-link {% if active_page=='details' %}active{% endif %}" href="/details">Details</a></li>
                        <li class="nav-item"><a class="nav-link {% if active_page=='report' %}active{% endif %}" href="/report">Report</a></li>
                        <li class="nav-item"><a class="nav-link {% if active_page=='logout' %}active{% endif %}" href="/logout">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    {% endblock %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
