{% extends 'sdm/base.html' %}

{% block title %}Master Data{% endblock %}

{% block body_class %}dashboard-page bg-light text-dark{% endblock %}

{% block content %}
<div class="container pt-5 pb-4">
    
    
    <div class="card shadow-sm border-0 p-2 p-md-4 bg-white text-dark mx-auto" style="border-radius: 12px; max-width: 1200px;">
        
        <div class="text-start mb-2">
            <h2 class="fw-bold text-primary m-0">Master Data</h2>
        </div>
        
        <div class="row g-6 mt-2">
            <div class="col-md-3 mb-2 p-2">
                <a href="/master-karyawan" class="btn btn-outline-primary btn-lg w-100 py-4 fw-bold d-flex flex-column align-items-center justify-content-center transition-all h-100" style="border-radius: 8px; font-size: 1.15rem; border-width: 2px;">
                    <span class="fs-3 mb-2">👤</span>
                    <span>Master Data Karyawan</span>
                </a>
            </div>
            
            <div class="col-md-3 mb-2 p-2">
                <a href="/master-kehadiran" class="btn btn-outline-primary btn-lg w-100 py-4 fw-bold d-flex flex-column align-items-center justify-content-center transition-all h-100" style="border-radius: 8px; font-size: 1.15rem; border-width: 2px;">
                    <span class="fs-3 mb-2">📅</span>
                    <span>Master Data Kehadiran</span>
                </a>
            </div>

            <div class="col-md-3 mb-2 p-2">
                <a href="/master-cuti" class="btn btn-outline-primary btn-lg w-100 py-4 fw-bold d-flex flex-column align-items-center justify-content-center transition-all h-100" style="border-radius: 8px; font-size: 1.15rem; border-width: 2px;">
                    <span class="fs-3 mb-2">📊</span>
                    <span>Master Data Cuti</span>
                </a>
            </div>

            <div class="col-md-3 mb-2 p-2">
                <a href="/master-jam-kerja" class="btn btn-outline-primary btn-lg w-100 py-4 fw-bold d-flex flex-column align-items-center justify-content-center transition-all h-100" style="border-radius: 8px; font-size: 1.15rem; border-width: 2px;">
                    <span class="fs-3 mb-2">⏱️</span>
                    <span>Kelebihan & Kekurangan Jam Kerja</span>
                </a>
            </div>

        </div>
    </div>
</div>

<style>
    .transition-all {
        transition: all 0.25s ease-in-out;
    }
    .btn-outline-primary:hover {
        transform: scale(1.01);
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
    }
    .btn-primary:hover {
        transform: scale(1.01);
        box-shadow: 0 6px 15px rgba(13, 110, 253, 0.3) !important;
    }
</style>
{% endblock %}
