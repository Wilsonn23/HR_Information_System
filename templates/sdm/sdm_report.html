{% extends 'sdm/base.html' %}

{% block title %}Menu Laporan (Report){% endblock %}

{% block body_class %}dashboard-page bg-light text-dark{% endblock %}

{% block content %}
<div class="container pt-5 pb-4">

    <div class="card shadow-sm border-0 p-4 p-md-5 bg-white text-dark mx-auto" style="border-radius: 12px; max-width: 850px;">
        
        <div class="text-start mb-4">
            <h2 class="fw-bold text-primary m-0">Generate Laporan (Report)</h2>
        </div>
        
        <div class="row g-4 mt-2 justify-content-center">
            
            <!-- Laporan Bulanan Kehadiran -->
            <div class="col-md-6 col-sm-12">
                <a href="/generate-laporan" class="btn btn-primary btn-lg w-100 py-5 fw-bold d-flex flex-column align-items-center justify-content-center shadow-sm transition-all h-100" style="border-radius: 12px; font-size: 1.25rem; background: linear-gradient(135deg, #0d6efd, #0b5ed7); border: none;">
                    <span class="fs-1 mb-2">📊</span>
                    <span>Laporan Bulanan Kehadiran</span>
                </a>
            </div>
            
            <!-- Laporan Kelebihan & Kekurangan Jam Kerja -->
            <div class="col-md-6 col-sm-12">
                <a href="/laporan-jam-kerja" class="btn btn-primary btn-lg w-100 py-5 fw-bold d-flex flex-column align-items-center justify-content-center shadow-sm transition-all h-100" style="border-radius: 12px; font-size: 1.25rem; background: linear-gradient(135deg, #0d6efd, #0b5ed7); border: none;">
                    <span class="fs-1 mb-2">⏱️</span>
                    <span>Kelebihan & Kekurangan Jam Kerja</span>
                </a>
            </div>

        </div>
    </div>
</div>

<style>
    .transition-all {
        transition: all 0.25s ease-in-out;
    }
    .btn-primary:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 20px rgba(13, 110, 253, 0.3) !important;
    }
</style>
{% endblock %}
