version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hris_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hris_db}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: hris_flask_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db

volumes:
  pgdata:
