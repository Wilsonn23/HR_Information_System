version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hris_postgres_db
    restart: always
    environment:
      POSTGRES_DB: hris_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Topuinoknok123!@#
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: hris_flask_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=hris_db
      - DB_PASSWORD=Topuinoknok123!@#
      - SECRET_KEY=TopSecretKey1234!@#$
    depends_on:
      - db

volumes:
  pgdata:
